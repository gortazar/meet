# Publish a release for a tag.
#
#     git tag v0.1 && git push origin v0.1
#
# Everything this needs is in this repository, which is why the workflow lives here: the
# automatic GITHUB_TOKEN can create a release and upload assets in its own repo, and no
# personal access token or secret is involved.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # The tag and the manifest have to agree, and this runs before anything is built or
      # published. Without it `git tag v0.9` on this tree would publish a release called
      # v0.9 containing whatever version the code actually is, and every check in the
      # repository would stay green — the tag is just a string, and the release title is
      # just text. This asks the bytes a user would install.
      #
      # `jq -r` on a missing key yields the string "null", which can never equal a tag, so a
      # manifest that lost the key cannot be published either.
      - name: The tag and the manifest agree
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r '."version-name"' src/metadata.json)"
          echo "tag=$tag_version  metadata.json=$manifest_version"
          [ "$tag_version" = "$manifest_version" ] || {
            echo "refusing to release: the tag says $tag_version and" \
                 "src/metadata.json says $manifest_version" >&2
            exit 1
          }

      # A release that fails its own tests is worse than no release.
      - run: nix flake check --print-build-logs

      - name: Pack the extension
        run: |
          nix build --print-build-logs
          mkdir -p dist
          cp result/*.shell-extension.zip dist/
          cd dist
          for zip in *.zip; do
            sha256sum "$zip" > "$zip.sha256"
          done
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          Install without building anything:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/gortazar/meet/main/install.sh | sh
          ```

          Then log out and back in, and enable it in the Extensions app.

          The asset below is the packed extension, exactly as `gnome-extensions pack` would
          lay it out, with its SHA-256 beside it.
          NOTES
          )"
