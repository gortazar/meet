# SonarQube Cloud analysis. Run by .github/workflows/ci.yml, which calls the shared
# workflow at gortazar/aideas/.github/workflows/sonar.yml@v1 — see
# https://github.com/gortazar/aideas/blob/main/ideas/quality-gate/README.md
sonar.projectKey=gortazar_meet
sonar.organization=gortazar
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

# No coverage report. This is GJS: the suite runs under gjs, not node, and there is no
# instrumentation story for it — so Sonar will read coverage on new code as 0%, which is why
# this project is on the "aideas uninstrumented" gate, which has no coverage condition. See
# ideas/quality-gate/baseline.md in the aideas repository.
